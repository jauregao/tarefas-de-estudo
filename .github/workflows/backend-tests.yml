name: API .NET - testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: API .NET - unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependências
        run: dotnet restore Tarefas.sln

      - name: Compilar API e testes
        run: dotnet build Tarefas.sln --configuration Release --no-restore

      - name: Executar testes unitários da API
        run: dotnet test Tarefas.sln --configuration Release --no-build --no-restore --filter "Category=Unit"
